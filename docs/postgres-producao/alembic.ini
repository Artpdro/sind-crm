[alembic]
script_location = migrations
prepend_sys_path = .
# A URL vem de MIGRATION_DATABASE_URL (usuário DONO do schema), nunca do arquivo.
sqlalchemy.url =

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
